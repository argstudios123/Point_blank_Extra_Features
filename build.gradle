plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    // Loom dev build for the Minecraft 26.x line. Verified in Phase 1:
    // 18.4 (stable) cannot build MC 26.1.2 (it requires a `mappings` dependency
    // that no longer exists), while this 1.18-SNAPSHOT build resolves MC 26.1.2,
    // Fabric API 0.149.1+26.1.2 and the two CurseForge Fabric mods.
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 26.1.2 Fabric runs on Java 25 (GeckoLib Fabric 5.5.2 requires it).
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    // Point Blank and GeckoLib are pulled from CurseForge (curse.maven coordinates).
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

// Minecraft 26.1.2 ships with the official (Mojang) names and is no longer
// obfuscated, so Loom needs no `mappings` dependency and there is no
// `modImplementation` configuration any more - mods are plain `implementation`.
// The addon is written against the official names, exactly like the Forge and
// NeoForge builds, so the existing sources keep compiling unchanged.

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Vic's Point Blank (Fabric 26.1.2, CurseForge file 8855629, version 2.2.0)
    // and GeckoLib (Fabric 26.1.2, CurseForge file 8327196, version 5.5.2).
    implementation "curse.maven:vics-point-blank-961053:${project.pointblank_file}"
    implementation "curse.maven:geckolib-388172:${project.geckolib_file}"
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            loader_version         : loader_version,
            loader_version_range   : loader_version_range,
            fabric_version         : fabric_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pointblank_version     : pointblank_version,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['fabric.mod.json', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
