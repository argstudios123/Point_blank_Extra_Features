plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// NeoForge 26.1.2 runs on Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

repositories {
    // JUnit 5 and the small libraries used by the isolated unit tests. Minecraft
    // itself is provided by moddevgradle, not from Maven Central.
    mavenCentral()
    maven {
        name = 'MinecraftLibraries'
        url = 'https://libraries.minecraft.net'
        content {
            includeGroup 'com.mojang'
        }
    }

    // Point Blank and GeckoLib are pulled from CurseForge (curse.maven coordinates).
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

neoForge {
    version = project.neo_version

    // NeoForge 26.1.2 is built on the official (Mojang) names and ships the
    // parameter names itself, so no Parchment layer is configured (matching the
    // NeoForge 26.1.2 mod development kit). Parchment does not publish 26.1.2
    // mappings.

    // The addon's own mixins only ever target Vic's Point Blank classes with
    // "remap = false", and NeoForge 26.1.2 runs one official-named namespace, so
    // no mixin refmap is required (Point Blank and GeckoLib ship without one too).

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Data generation. The NeoForge 26.1.2 dev config no longer provides the old
        // combined "data" run type - its run types are client, clientData, serverData,
        // gameTestServer, server and junit - and moddevgradle's legacy data() DSL method
        // still sets exactly that removed "data" type, which makes :prepareDataRun fail
        // with "Trying to prepare unknown run: data".
        //
        // The client-side data generator (net.minecraft.client.data.Main, run type
        // clientData) is the successor of the old client "data" run: it takes the same
        // --mod/--all/--output/--existing arguments and still generates the client and
        // server providers registered through GatherDataEvent. The run keeps its
        // historical name so the runData task and the IDE "Data" configuration keep
        // working.
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {
    implementation "curse.maven:vics-point-blank-961053:8938498"
    implementation "curse.maven:geckolib-388172:8327201"


    // Plain JUnit 5 tests for the Minecraft-independent melee geometry helpers.
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.9.2"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:5.9.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.9.2"

    // MeleeConfig touches Gson and Mojang's LogUtils even though it does not use
    // the game itself; provide those libraries to the isolated test runtime.
    testImplementation "com.google.code.gson:gson:2.14.0"
    testImplementation "com.mojang:logging:1.6.11"
    testImplementation "org.slf4j:slf4j-api:2.0.1"

    // Bullet-hole configuration exposes Minecraft resource identifiers (but no
    // game state). moddevgradle does not add the Minecraft artifacts to the test
    // source set automatically, so reuse main's resolved compile classpath.
    testImplementation files(sourceSets.main.compileClasspath)
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            pointblank_version     : pointblank_version,
            geckolib_version       : geckolib_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
