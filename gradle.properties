org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# ---------------------------------------------------------------------------
# Fabric toolchain (Minecraft 26.1.2) - Phase 1 verified:
#  * fabric-loom dev build 1.18-SNAPSHOT is the only Loom line that can build
#    MC 26.1.2; the stable 1.18.4 release still demands a `mappings` dependency
#    that no longer exists because Minecraft 26.x ships unobfuscated.
#  * Gradle 9.7.1 is the official template's Gradle for this Loom line.
#  * Minecraft 26.1.2 is unobfuscated, so the project declares NO `mappings`.
#  * Java 25 is required (GeckoLib Fabric 5.5.2 declares java >=25).
# ---------------------------------------------------------------------------
minecraft_version=26.1.2
minecraft_version_range=>=26.1.2 <26.2
loader_version=0.19.3
loader_version_range=>=0.19.2
fabric_version=0.149.1+26.1.2

