modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# NeoForge reads the mixin configuration straight from the mod metadata (in dev and
# in the published jar), so no MANIFEST "MixinConfigs" attribute is needed.
[[mixins]]
config="pointblankextra.mixins.json"

[[dependencies.pointblankextra]]
modId="neoforge"
type="required"
versionRange="[26.1.2,)"
ordering="NONE"
side="BOTH"

[[dependencies.pointblankextra]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.pointblankextra]]
modId="pointblank"
type="required"
versionRange="[${pointblank_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.pointblankextra]]
modId="geckolib"
type="required"
versionRange="[${geckolib_version},)"
ordering="AFTER"
side="BOTH"
